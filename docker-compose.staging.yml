# Botseri · Docker Compose Staging Profile (S13 §2)
name: botseri-staging

x-restart: &restart
  restart: unless-stopped

services:
  botseri-staging-db:
    <<: *restart
    container_name: botseri-staging-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botseri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botseri_dev}
      POSTGRES_DB: botseri_staging
    volumes:
      - botseri_staging_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks: [botseri-staging-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-botseri} -d botseri_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  botseri-staging-dashboard:
    <<: *restart
    container_name: botseri-staging-dashboard
    build: ./dashboard
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-botseri}:${POSTGRES_PASSWORD:-botseri_dev}@botseri-staging-db:5432/botseri_staging
      WAHA_URL: http://botseri-staging-waha:3000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: test
      WAHA_MOCK_OUTBOUND: "1"
      WAHA_FAST_TEST: "1"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-staging-internal-token-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SESSION_SECRET: ${SESSION_SECRET:-staging-session-secret-at-least-32-chars-long}
    depends_on:
      botseri-staging-db: { condition: service_healthy }
    ports:
      - "127.0.0.1:3001:3000"
    networks: [botseri-staging-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/internal/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  botseri-staging-waha:
    <<: *restart
    container_name: botseri-staging-waha
    image: devlikeapro/waha:${WAHA_VERSION:-2026.9.1}
    platform: linux/amd64
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-staging-waha-key}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_NOWEB_WA_VERSION: auto-web
      WHATSAPP_HOOK_URL: http://botseri-staging-n8n:5678/webhook/wa-incoming
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_START_SESSION: default
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "true"
    volumes:
      - botseri_staging_wahadata:/app/.sessions
    ports:
      - "127.0.0.1:3002:3000"
    networks: [botseri-staging-net]

  botseri-staging-n8n:
    <<: *restart
    container_name: botseri-staging-n8n
    build:
      context: ./n8n-engine
      args:
        N8N_VERSION: ${N8N_VERSION:-1.64.1}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-staging-n8n-encryption-key-secret}
      N8N_DISABLE_UI: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ_DEFAULT:-Asia/Jakarta}
      TZ: ${TZ_DEFAULT:-Asia/Jakarta}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-staging-internal-token-secret}
      DASHBOARD_URL: http://botseri-staging-dashboard:3000
      WAHA_URL: http://botseri-staging-waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-staging-waha-key}
      WAHA_SESSION: default
    volumes:
      - botseri_staging_n8ndata:/home/node/.n8n
      - ./n8n-engine/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5679:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      botseri-staging-dashboard: { condition: service_healthy }
      botseri-staging-waha: { condition: service_started }
    networks: [botseri-staging-net]

networks:
  botseri-staging-net:
    name: botseri-staging-net

volumes:
  botseri_staging_pgdata:
  botseri_staging_n8ndata:
  botseri_staging_wahadata:
